[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codex-cli-helper"
version = "0.1.0"
description = "Small local CLI for starting durable Codex app-server tasks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ToolRelay" }]
dependencies = [
  "cyclopts>=4.25,<5",
  "websockets>=17,<18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
codex-cli-helper = "codex_cli_helper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_cli_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
