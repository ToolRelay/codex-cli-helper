name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest -q -m "not live"
      - name: Compile package
        run: python -m compileall -q src tests

  release:
    name: Determine semantic release
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.semantic_release.outputs.released || 'false' }}
      tag: ${{ steps.semantic_release.outputs.tag }}
    steps:
      - name: Check out release branch at tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Pin checkout to triggering commit
        run: git reset --hard "${{ github.sha }}"
      - name: Create semantic release
        id: semantic_release
        uses: python-semantic-release/python-semantic-release@v10.6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com

  build:
    name: Build ${{ matrix.asset }}
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: codex-cli-helper-linux-x86_64
          - os: ubuntu-22.04-arm
            asset: codex-cli-helper-linux-aarch64
          - os: macos-15-intel
            asset: codex-cli-helper-macos-x86_64
          - os: macos-14
            asset: codex-cli-helper-macos-aarch64
          - os: windows-2022
            asset: codex-cli-helper-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[build]"
      - name: Build one-file executable
        run: python scripts/build_executable.py
      - name: Name executable and create checksum
        run: python scripts/prepare_release_asset.py --asset-name "${{ matrix.asset }}"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Attach executables to release
    needs:
      - release
      - build
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          path: dist
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: gh release upload "${{ needs.release.outputs.tag }}" dist/* --clobber --repo "$GITHUB_REPOSITORY"
